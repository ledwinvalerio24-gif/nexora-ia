<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA AI ✦ Your playful business copilot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#1b2940}.layout{display:flex;min-height:100vh}aside{width:230px;background:#101b31;color:#eaf0fa;padding:24px 15px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:20px}.brand span{color:#55d3cb}.tag{font-size:9px;letter-spacing:1.4px;color:#8190aa;margin:9px 0 25px 2px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#aab7cc;text-align:left;padding:12px;border-radius:8px;cursor:pointer}nav button.active,nav button:hover{background:#1e2d4a;color:white}.profile{margin-top:auto;border-top:1px solid #293754;padding-top:15px;font-size:12px}.profile small{display:block;color:#8492aa;margin-top:4px}main{flex:1}header{height:64px;background:white;border-bottom:1px solid #e7edf4;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.badge{background:#eaf8f5;color:#15938b;border-radius:18px;padding:8px 12px}.content{max-width:1150px;margin:auto;padding:28px}.hero{padding:28px;border-radius:15px;color:white;background:linear-gradient(110deg,#142541,#1b4764)}.hero small{color:#62d8d0;letter-spacing:1.3px}.hero h1{margin:12px 0}.hero p{color:#bfcee0;font-size:14px}.stats,.cols,.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.cols{grid-template-columns:1.1fr 1fr}.plans{grid-template-columns:repeat(3,1fr)}.card{background:white;border:1px solid #e8edf3;border-radius:12px;padding:18px}.stat label{display:flex;justify-content:space-between;color:#78859a;font-size:12px}.stat strong{display:block;font-size:25px;margin:15px 0 7px}.stat small,.muted{color:#8995a7;font-size:12px}.action{display:block;width:100%;padding:12px;border:1px solid #edf0f5;background:white;border-radius:8px;margin:8px 0;text-align:left;cursor:pointer}.primary{background:#16a9a4;border:0;color:white;padding:11px 14px;border-radius:8px;cursor:pointer}.chat{height:320px;overflow:auto;background:#f7f9fc;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:15px 0}.bubble{padding:11px;border-radius:10px;max-width:80%;font-size:13px}.ai{align-self:flex-start;background:white;border:1px solid #e8edf3}.you{align-self:flex-end;background:#ddf7f4}.send,.form{display:flex;gap:8px;margin:12px 0}.send input,.form input,.settings input{border:1px solid #dfe6ef;padding:11px;border-radius:8px;flex:1;min-width:0}.row{padding:13px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;font-size:13px}.row span{color:#8995a6}.plan strong{font-size:27px}.plan p{color:#8995a6;font-size:13px;min-height:38px}.plan button{width:100%}label{display:block;margin:15px 0;font-size:13px}label input{display:block;width:100%;margin-top:7px}.empty{color:#909bad;padding:15px}@media(max-width:750px){aside{width:68px;padding:15px 8px}.brand{font-size:0}.tag,.profile small,nav button:not(.active){display:none}.nav button,nav button{font-size:0;text-align:center}.profile{font-size:0}.content{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.plans{grid-template-columns:1fr}header{padding:0 15px}.form{flex-direction:column}}

/* NEXORA playful identity */
:root{--mint:#b9f4df;--purple:#e6dcff;--ink:#252344}body{background:#faf8ff;color:var(--ink)}aside{background:#242046;border-radius:0 24px 24px 0;box-shadow:6px 0 28px #2c1f4b13}.brand{letter-spacing:-.5px}.brand:before{content:'✦';color:#baf7e0;font-size:26px;margin-right:8px}.brand span{color:#b8f5e2}nav button{border-radius:14px;font-weight:600}nav button.active,nav button:hover{background:#4c417a}.badge{background:#e9fff5;color:#27816c}.hero{background:linear-gradient(125deg,#5041a1,#7d66cb 65%,#4caeab);border-radius:25px;box-shadow:0 15px 35px #6d55bd26;padding:34px;overflow:hidden}.hero h1{font-size:clamp(24px,3vw,36px);letter-spacing:-1px}.hero small{color:#c5ffde}.hero p{color:#f1eaff}.hero:after{content:'✦';position:absolute;right:55px;top:10px;font-size:125px;color:#ffffff27;transform:rotate(-15deg)}.hero{position:relative}.card{border-radius:20px;border-color:#eee9fa;box-shadow:0 5px 22px #47327a09}.primary{background:#6751bc;border-radius:12px;font-weight:700}.primary:hover{background:#4e399f}.action{border-radius:13px;background:#fbfaff}.action:hover{background:#efeaff}.stat strong{color:#5743a3}.bubble.ai{background:#f1eaff;border-color:#e6d9ff}.bubble.you{background:#dff9ee}.chat{background:#fcfaff;border:1px solid #f0eafb}.mascot{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:23px;background:#d7fff0;color:#5140a1;font-size:43px;box-shadow:0 10px 20px #34227c20;transform:rotate(-7deg);animation:bob 3s ease-in-out infinite}.mascot.small{width:37px;height:37px;border-radius:13px;font-size:24px;vertical-align:middle;margin-right:8px}.assistant-tip{background:#fff6d8;border:1px solid #f6e7ae;border-radius:14px;padding:14px;font-size:13px;margin:14px 0}.chat-prompt{display:inline-block;border:1px solid #dcd3ff;border-radius:99px;padding:9px 12px;margin:5px 5px 5px 0;background:#fff;color:#5a459f;cursor:pointer;font-size:12px}.chat-prompt:hover{background:#efeaff}.hello{display:flex;gap:14px;align-items:center}.hello p{margin:3px 0;color:#eae3ff}.funlabel{font-size:12px;color:#6751bc;font-weight:700}.footer-note{margin-top:20px;font-size:11px;color:#9d94b4;text-align:center}@keyframes bob{50%{transform:translateY(-6px) rotate(5deg)}}@media(max-width:750px){.hero:after{right:5px;font-size:80px;top:55px}.hero{padding:22px}.mascot{width:50px;height:50px;font-size:30px}aside{border-radius:0 15px 15px 0}}
</style></head><body><div class="layout"><aside><div class="brand">NEXORA <span>AI</span></div><div class="tag">BUSINESS AUTOMATION</div><nav id="nav"></nav><div class="profile">Demo workspace<small>Free prototype</small></div></aside><main><header><span>Workspace / <b id="crumb">Overview</b></span><span class="badge">✦ Demo playground</span></header><section id="content" class="content"></section></main></div>
<script>
const pages=['Overview','AI Assistant','Clients','Appointments','Membership','Settings'];let current='Overview',clients=JSON.parse(localStorage.nxclients||'[]'),appointments=JSON.parse(localStorage.nxappointments||'[]'),business=JSON.parse(localStorage.nxbusiness||'{"name":"Your Business","type":"Service business","hours":"Mon–Fri, 9 AM–5 PM"}'),messages=[['ai','Hi! Ask about services, hours, or appointments. This is a demo assistant.']];
function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===current?'active':''}" onclick="go('${p}')">${p}</button>`).join('');document.querySelector('#crumb').textContent=current;let c=document.querySelector('#content');
if(current==='Overview')c.innerHTML=`<div class="hero"><small>YOUR FRIENDLY BUSINESS SIDEKICK</small><div class="hello"><div><h1>Hey there, let’s make magic! ✨</h1><p>Your little helper for big business dreams. Chat, book, grow — all in one happy place.</p></div><div class="mascot" aria-label="Nexi mascot">✿</div></div></div><div class="stats">${[['Conversations','128'],['New leads',clients.length],['Appointments',appointments.length],['Assistant status','Demo']].map(([a,b])=>`<div class="card stat"><label>${a}</label><strong>${b}</strong><small>Preview mode</small></div>`).join('')}</div><div class="cols"><div class="card"><h3>Quick actions</h3><button class="action" onclick="go('AI Assistant')">🤖 Test AI assistant</button><button class="action" onclick="go('Clients')">👥 Add a client</button><button class="action" onclick="go('Appointments')">📅 Create appointment</button></div><div class="card"><h3><span class="mascot small">✿</span> Meet Nexi, your chatbot!</h3><p>🟢 Nexi is ready to say hello</p><p class="muted">Customize business information to prepare your assistant.</p><button class="primary" onclick="go('Settings')">Configure assistant</button></div></div>`;
else if(current==='AI Assistant')c.innerHTML=`<div class="card"><h2><span class="mascot small">✿</span> Chat with Nexi</h2><p class="muted">Your cheerful business sidekick · demo responses</p><div class="assistant-tip">💡 Try asking Nexi a question! This is a playful preview, not live AI yet.</div><div><button class="chat-prompt" onclick="ask('What are your hours?')">🕒 Business hours</button><button class="chat-prompt" onclick="ask('Can I book an appointment?')">📅 Book a visit</button><button class="chat-prompt" onclick="ask('What services do you offer?')">✨ Services</button></div><div class="chat" id="chat">${messages.map(m=>`<div class="bubble ${m[0]}">${escapeHtml(m[1])}</div>`).join('')}</div><div class="send"><input id="msg" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Send</button></div></div>`;
else if(current==='Clients')c.innerHTML=`<div class="card"><h2>Clients & leads</h2><div class="send"><input id="client" placeholder="Client name"><button class="primary" onclick="addClient()">Add client</button></div>${clients.map(x=>`<div class="row"><b>${escapeHtml(x.name)}</b><span>${x.date}</span></div>`).join('')||'<p class="empty">No clients saved yet.</p>'}</div>`;
else if(current==='Appointments')c.innerHTML=`<div class="card"><h2>Appointments</h2><div class="form"><input id="apname" placeholder="Client name"><input id="apdate" type="date"><input id="apt" type="time"><button class="primary" onclick="addAppt()">Add appointment</button></div>${appointments.map(a=>`<div class="row"><b>${escapeHtml(a.name)}</b><span>${a.date} · ${a.time}</span></div>`).join('')||'<p class="empty">No appointments scheduled.</p>'}</div>`;
else if(current==='Membership')c.innerHTML=`<h2>Membership plans</h2><p class="muted">Checkout is not connected in this prototype.</p><div class="plans">${[['Starter','$29','Basic assistant preview'],['Pro','$79','Lead capture and appointments'],['Business','$149','Advanced automation']].map(p=>`<div class="card plan"><h3>${p[0]}</h3><strong>${p[1]}<small>/month</small></strong><p>${p[2]}</p><button class="primary" onclick="alert('Payments are not connected yet.')">Choose plan</button></div>`).join('')}</div>`;
else c.innerHTML=`<div class="card"><h2>Business settings</h2><label>Business name<input id="bn" value="${escapeAttr(business.name)}" oninput="saveBiz()"></label><label>Business type<input id="bt" value="${escapeAttr(business.type)}" oninput="saveBiz()"></label><label>Business hours<input id="bh" value="${escapeAttr(business.hours)}" oninput="saveBiz()"></label><p class="muted">Saved locally in this browser.</p></div>`;
}
function go(p){current=p;render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function ask(t){document.querySelector('#msg').value=t;send()}function send(){let el=document.querySelector('#msg'),t=el.value.trim();if(!t)return;messages.push(['you',t],['ai','Hey hey! ✨ I’m Nexi, your demo buddy. Soon I’ll answer using your business info and help with bookings. For now, I’m just showing you how our chat will feel! 🌈']);render();document.querySelector('#chat').scrollTop=9999}
function addClient(){let v=document.querySelector('#client').value.trim();if(!v)return;clients.push({name:v,date:new Date().toLocaleDateString()});localStorage.nxclients=JSON.stringify(clients);render()}
function addAppt(){let name=document.querySelector('#apname').value,date=document.querySelector('#apdate').value,time=document.querySelector('#apt').value;if(!name||!date||!time)return;appointments.push({name,date,time});localStorage.nxappointments=JSON.stringify(appointments);render()}
function saveBiz(){business={name:document.querySelector('#bn').value,type:document.querySelector('#bt').value,hours:document.querySelector('#bh').value};localStorage.nxbusiness=JSON.stringify(business)}
render();
</script></body></html>
