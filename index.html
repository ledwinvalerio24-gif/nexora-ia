<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA AI ✦ Your playful business copilot</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#1b2940}.layout{display:flex;min-height:100vh}aside{width:230px;background:#101b31;color:#eaf0fa;padding:24px 15px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:20px}.brand span{color:#55d3cb}.tag{font-size:9px;letter-spacing:1.4px;color:#8190aa;margin:9px 0 25px 2px}nav{display:grid;gap:6px}nav button{border:0;background:transparent;color:#aab7cc;text-align:left;padding:12px;border-radius:8px;cursor:pointer}nav button.active,nav button:hover{background:#1e2d4a;color:white}.profile{margin-top:auto;border-top:1px solid #293754;padding-top:15px;font-size:12px}.profile small{display:block;color:#8492aa;margin-top:4px}main{flex:1}header{height:64px;background:white;border-bottom:1px solid #e7edf4;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.badge{background:#eaf8f5;color:#15938b;border-radius:18px;padding:8px 12px}.content{max-width:1150px;margin:auto;padding:28px}.hero{padding:28px;border-radius:15px;color:white;background:linear-gradient(110deg,#142541,#1b4764)}.hero small{color:#62d8d0;letter-spacing:1.3px}.hero h1{margin:12px 0}.hero p{color:#bfcee0;font-size:14px}.stats,.cols,.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.cols{grid-template-columns:1.1fr 1fr}.plans{grid-template-columns:repeat(3,1fr)}.card{background:white;border:1px solid #e8edf3;border-radius:12px;padding:18px}.stat label{display:flex;justify-content:space-between;color:#78859a;font-size:12px}.stat strong{display:block;font-size:25px;margin:15px 0 7px}.stat small,.muted{color:#8995a7;font-size:12px}.action{display:block;width:100%;padding:12px;border:1px solid #edf0f5;background:white;border-radius:8px;margin:8px 0;text-align:left;cursor:pointer}.primary{background:#16a9a4;border:0;color:white;padding:11px 14px;border-radius:8px;cursor:pointer}.chat{height:320px;overflow:auto;background:#f7f9fc;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin:15px 0}.bubble{padding:11px;border-radius:10px;max-width:80%;font-size:13px}.ai{align-self:flex-start;background:white;border:1px solid #e8edf3}.you{align-self:flex-end;background:#ddf7f4}.send,.form{display:flex;gap:8px;margin:12px 0}.send input,.form input,.settings input{border:1px solid #dfe6ef;padding:11px;border-radius:8px;flex:1;min-width:0}.row{padding:13px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;font-size:13px}.row span{color:#8995a6}.plan strong{font-size:27px}.plan p{color:#8995a6;font-size:13px;min-height:38px}.plan button{width:100%}label{display:block;margin:15px 0;font-size:13px}label input{display:block;width:100%;margin-top:7px}.empty{color:#909bad;padding:15px}@media(max-width:750px){aside{width:68px;padding:15px 8px}.brand{font-size:0}.tag,.profile small,nav button:not(.active){display:none}.nav button,nav button{font-size:0;text-align:center}.profile{font-size:0}.content{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.plans{grid-template-columns:1fr}header{padding:0 15px}.form{flex-direction:column}}

/* NEXORA playful identity */
:root{--mint:#b9f4df;--purple:#e6dcff;--ink:#252344}body{background:#faf8ff;color:var(--ink)}aside{background:#242046;border-radius:0 24px 24px 0;box-shadow:6px 0 28px #2c1f4b13}.brand{letter-spacing:-.5px}.brand:before{content:'✦';color:#baf7e0;font-size:26px;margin-right:8px}.brand span{color:#b8f5e2}nav button{border-radius:14px;font-weight:600}nav button.active,nav button:hover{background:#4c417a}.badge{background:#e9fff5;color:#27816c}.hero{background:linear-gradient(125deg,#5041a1,#7d66cb 65%,#4caeab);border-radius:25px;box-shadow:0 15px 35px #6d55bd26;padding:34px;overflow:hidden}.hero h1{font-size:clamp(24px,3vw,36px);letter-spacing:-1px}.hero small{color:#c5ffde}.hero p{color:#f1eaff}.hero:after{content:'✦';position:absolute;right:55px;top:10px;font-size:125px;color:#ffffff27;transform:rotate(-15deg)}.hero{position:relative}.card{border-radius:20px;border-color:#eee9fa;box-shadow:0 5px 22px #47327a09}.primary{background:#6751bc;border-radius:12px;font-weight:700}.primary:hover{background:#4e399f}.action{border-radius:13px;background:#fbfaff}.action:hover{background:#efeaff}.stat strong{color:#5743a3}.bubble.ai{background:#f1eaff;border-color:#e6d9ff}.bubble.you{background:#dff9ee}.chat{background:#fcfaff;border:1px solid #f0eafb}.mascot{display:inline-grid;place-items:center;width:70px;height:70px;border-radius:23px;background:#d7fff0;color:#5140a1;font-size:43px;box-shadow:0 10px 20px #34227c20;transform:rotate(-7deg);animation:bob 3s ease-in-out infinite}.mascot.small{width:37px;height:37px;border-radius:13px;font-size:24px;vertical-align:middle;margin-right:8px}.assistant-tip{background:#fff6d8;border:1px solid #f6e7ae;border-radius:14px;padding:14px;font-size:13px;margin:14px 0}.chat-prompt{display:inline-block;border:1px solid #dcd3ff;border-radius:99px;padding:9px 12px;margin:5px 5px 5px 0;background:#fff;color:#5a459f;cursor:pointer;font-size:12px}.chat-prompt:hover{background:#efeaff}.hello{display:flex;gap:14px;align-items:center}.hello p{margin:3px 0;color:#eae3ff}.funlabel{font-size:12px;color:#6751bc;font-weight:700}.footer-note{margin-top:20px;font-size:11px;color:#9d94b4;text-align:center}@keyframes bob{50%{transform:translateY(-6px) rotate(5deg)}}@media(max-width:750px){.hero:after{right:5px;font-size:80px;top:55px}.hero{padding:22px}.mascot{width:50px;height:50px;font-size:30px}aside{border-radius:0 15px 15px 0}}
.studio-grid{display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(260px,.9fr);gap:18px}.studio-top{margin-bottom:18px}.studio-top h1{margin:0 0 7px}.studio-right{display:grid;align-content:start;gap:16px}.studio-grid input,.studio-grid select,.studio-grid textarea{display:block;width:100%;padding:11px;margin-top:7px;border:1px solid #e0d9ef;border-radius:11px;background:#fff;font:inherit}.studio-grid textarea{min-height:72px;resize:vertical}.studio-grid input[type=color]{height:47px;padding:4px}.botpreview{border:1px solid #e8e3f4;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 14px 30px #32225b12;max-width:390px;margin:auto}.preview-head{display:flex;align-items:center;gap:12px;padding:16px;color:#fff}.preview-head small{display:block;margin-top:3px;font-size:11px;opacity:.85}.preview-avatar{width:44px;height:44px;border-radius:15px;background:#ffffff35;display:grid;place-items:center;font-size:27px}.preview-body{min-height:190px;background:#fcfaff;padding:18px}.preview-bubble{max-width:90%;border-radius:16px 16px 16px 3px;background:#f0eaff;padding:13px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}.preview-buttons{margin-top:14px;display:flex;gap:5px;flex-wrap:wrap}.preview-buttons button{border:1px solid #ddd4f5;background:#fff;color:#6553a5;border-radius:15px;padding:7px 10px;cursor:pointer}.preview-foot{padding:13px;color:#a39cb1;font-size:12px;border-top:1px solid #f0ecf5}@media(max-width:900px){.studio-grid{grid-template-columns:1fr}}@media(max-width:750px){nav button.active{font-size:10px;word-break:break-word;padding:8px 2px}.studio-top h1{font-size:23px}}
</style></head><body><div class="layout"><aside><div class="brand">NEXORA <span>AI</span></div><div class="tag">BUSINESS AUTOMATION</div><nav id="nav"></nav><div class="profile">Demo workspace<small>Free prototype</small></div></aside><main><header><span>Workspace / <b id="crumb">Overview</b></span><span class="badge">✦ Demo playground</span></header><section id="content" class="content"></section></main></div>
<script>
const pages=['Overview','AI Assistant','Clients','Appointments','Membership','Settings','Chatbot Studio'];let current='Overview',clients=JSON.parse(localStorage.nxclients||'[]'),appointments=JSON.parse(localStorage.nxappointments||'[]'),business=JSON.parse(localStorage.nxbusiness||'{"name":"Your Business","type":"Service business","hours":"Mon–Fri, 9 AM–5 PM"}'),messages=[['ai','¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte? ✨']];
const defaults={name:'Nexi',avatar:'✿',color:'#6751bc',tone:'friendly',welcome:'¡Hola! ✨ ¿En qué puedo ayudarte hoy?',faq:'',services:'',language:'es'};
let bot={...defaults,...JSON.parse(localStorage.nxbot||'{}')};
function botSave(){bot={name:document.querySelector('#botname').value.trim().slice(0,30)||'Nexi',avatar:document.querySelector('#botavatar').value,color:document.querySelector('#botcolor').value,tone:document.querySelector('#bottone').value,welcome:document.querySelector('#botwelcome').value.slice(0,250),faq:document.querySelector('#botfaq').value.slice(0,2000),services:document.querySelector('#botservices').value.slice(0,1000),language:document.querySelector('#botlanguage').value};localStorage.nxbot=JSON.stringify(bot);document.querySelector('#botpreview').innerHTML=previewHtml();refreshEmbed()}
function previewHtml(){return `<div class="preview-head" style="background:${escapeAttr(bot.color)}"><span class="preview-avatar">${escapeHtml(bot.avatar)}</span><div><strong>${escapeHtml(bot.name)}</strong><small>● Demo assistant</small></div></div><div class="preview-body"><div class="preview-bubble">${escapeHtml(bot.welcome||'¡Hola!')}</div><div class="preview-buttons">${['Horarios','Servicios','Reservar'].map(t=>`<button type="button" onclick="go('AI Assistant');ask('${t}')">${t}</button>`).join('')}</div></div><div class="preview-foot">Escribe tu mensaje…　➤</div>`}
function demoReply(t){const q=t.toLowerCase(),hours=/hora|hour|open|abier|cerrad/.test(q),services=/servic|precio|price|cost|cuánto/.test(q),booking=/reserv|cita|book|appoint/.test(q);let response=hours?`Nuestro horario es: ${business.hours}.`:services?`Servicios de ${business.name}: ${bot.services||'Todavía no se han configurado los servicios.'}`:booking?'¡Claro! Puedes solicitar una cita; la confirmación automática aún no está activada.':bot.faq&&bot.faq.toLowerCase().includes(q)?bot.faq:`Gracias por escribir a ${business.name}. Soy ${bot.name}, un asistente de demostración. ¿Te ayudo con horarios, servicios o citas?`;return bot.tone==='formal'?response.replace('¡Claro!','Con gusto.'):bot.tone==='playful'?`✨ ${response} 🌈`:response}
function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===current?'active':''}" onclick="go('${p}')">${p}</button>`).join('');document.querySelector('#crumb').textContent=current;let c=document.querySelector('#content');
if(current==='Overview')c.innerHTML=`<div class="hero"><small>YOUR FRIENDLY BUSINESS SIDEKICK</small><div class="hello"><div><h1>Hey there, let’s make magic! ✨</h1><p>Your little helper for big business dreams. Chat, book, grow — all in one happy place.</p></div><div class="mascot" aria-label="Nexi mascot">✿</div></div></div><div class="stats">${[['Conversations','128'],['New leads',clients.length],['Appointments',appointments.length],['Assistant status','Demo']].map(([a,b])=>`<div class="card stat"><label>${a}</label><strong>${b}</strong><small>Preview mode</small></div>`).join('')}</div><div class="cols"><div class="card"><h3>Quick actions</h3><button class="action" onclick="go('AI Assistant')">🤖 Test AI assistant</button><button class="action" onclick="go('Clients')">👥 Add a client</button><button class="action" onclick="go('Appointments')">📅 Create appointment</button></div><div class="card"><h3><span class="mascot small">✿</span> Meet Nexi, your chatbot!</h3><p>🟢 Nexi is ready to say hello</p><p class="muted">Customize business information to prepare your assistant.</p><button class="primary" onclick="go('Chatbot Studio')">🎨 Personalize chatbot</button></div></div>`;
else if(current==='AI Assistant')c.innerHTML=`<div class="card"><h2><span class="mascot small">${escapeHtml(bot.avatar)}</span> Chat with ${escapeHtml(bot.name)}</h2><p class="muted">Your cheerful business sidekick · demo responses</p><div class="assistant-tip">💡 Try asking Nexi a question! This is a playful preview, not live AI yet.</div><div><button class="chat-prompt" onclick="ask('What are your hours?')">🕒 Business hours</button><button class="chat-prompt" onclick="ask('Can I book an appointment?')">📅 Book a visit</button><button class="chat-prompt" onclick="ask('What services do you offer?')">✨ Services</button></div><div class="chat" id="chat">${messages.map(m=>`<div class="bubble ${m[0]}">${escapeHtml(m[1])}</div>`).join('')}</div><div class="send"><input id="msg" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Send</button></div></div>`;
else if(current==='Clients')c.innerHTML=`<div class="card"><h2>Clients & leads</h2><div class="send"><input id="client" placeholder="Client name"><button class="primary" onclick="addClient()">Add client</button></div>${clients.map(x=>`<div class="row"><b>${escapeHtml(x.name)}</b><span>${x.date}</span></div>`).join('')||'<p class="empty">No clients saved yet.</p>'}</div>`;
else if(current==='Appointments')c.innerHTML=`<div class="card"><h2>Appointments</h2><div class="form"><input id="apname" placeholder="Client name"><input id="apdate" type="date"><input id="apt" type="time"><button class="primary" onclick="addAppt()">Add appointment</button></div>${appointments.map(a=>`<div class="row"><b>${escapeHtml(a.name)}</b><span>${a.date} · ${a.time}</span></div>`).join('')||'<p class="empty">No appointments scheduled.</p>'}</div>`;
else if(current==='Membership')c.innerHTML=`<h2>Membership plans</h2><p class="muted">Checkout is not connected in this prototype.</p><div class="plans">${[['Starter','$29','Basic assistant preview'],['Pro','$79','Lead capture and appointments'],['Business','$149','Advanced automation']].map(p=>`<div class="card plan"><h3>${p[0]}</h3><strong>${p[1]}<small>/month</small></strong><p>${p[2]}</p><button class="primary" onclick="alert('Payments are not connected yet.')">Choose plan</button></div>`).join('')}</div>`;
else if(current==='Settings')c.innerHTML=`<div class="card"><h2>Business settings</h2><label>Business name<input id="bn" value="${escapeAttr(business.name)}" oninput="saveBiz()"></label><label>Business type<input id="bt" value="${escapeAttr(business.type)}" oninput="saveBiz()"></label><label>Business hours<input id="bh" value="${escapeAttr(business.hours)}" oninput="saveBiz()"></label><p class="muted">Saved locally in this browser.</p><button class="primary" onclick="go('Chatbot Studio')">🎨 Open Chatbot Studio</button></div>`;
else c.innerHTML=`<div class="studio-top"><h1>🎨 Chatbot Studio</h1><p class="muted">Make your assistant feel like your brand. Customize its personality and see a live preview.</p></div><div class="studio-grid"><div class="card"><h2>✨ Your assistant's personality</h2><label>Assistant name<input id="botname" maxlength="30" value="${escapeAttr(bot.name)}" oninput="botSave()"></label><label>Avatar<select id="botavatar" onchange="botSave()">${['✿','🤖','🐻','🦊','🐱','🌟','💜','☁️'].map(v=>`<option value="${v}" ${bot.avatar===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Brand color<input type="color" id="botcolor" value="${escapeAttr(bot.color)}" oninput="botSave()"></label><label>Personality<select id="bottone" onchange="botSave()"><option value="friendly" ${bot.tone==='friendly'?'selected':''}>Friendly 😊</option><option value="playful" ${bot.tone==='playful'?'selected':''}>Playful 🎉</option><option value="formal" ${bot.tone==='formal'?'selected':''}>Professional 💼</option></select></label><label>Language<select id="botlanguage" onchange="botSave()"><option value="es" ${bot.language==='es'?'selected':''}>Español</option><option value="en" ${bot.language==='en'?'selected':''}>English</option></select></label><label>Welcome message<textarea id="botwelcome" maxlength="250" oninput="botSave()">${escapeHtml(bot.welcome)}</textarea></label><label>Services & prices<textarea id="botservices" placeholder="Haircut - $25; Beard trim - $15" oninput="botSave()">${escapeHtml(bot.services)}</textarea></label><label>Frequently asked questions<textarea id="botfaq" placeholder="Parking: free behind the store" oninput="botSave()">${escapeHtml(bot.faq)}</textarea></label><button class="primary" onclick="go('AI Assistant')">💬 Test chatbot</button><p class="muted">Changes save only in this browser. No live AI is connected.</p></div><div class="studio-right"><div class="card"><h3>👀 Live preview</h3><div id="botpreview" class="botpreview">${previewHtml()}</div></div><div class="card"><h3>🌐 Install on your website</h3><p class="muted">Copy the self-contained embed code below and paste it before the closing &lt;/body&gt; tag of your website. Demo widget only; settings are included in the public code.</p><textarea id="embedcode" readonly style="width:100%;min-height:110px;font-size:11px;overflow-wrap:anywhere"></textarea><button class="primary" onclick="copyEmbed()">📋 Copy embed code</button><p class="muted" id="copyhint">This widget does not connect to AI or store messages.</p></div><div class="card"><h3>✨ Tips for your brand</h3><p class="muted">Choose a name customers will remember, match your business colors, and use a welcome message that sounds like your team.</p></div></div></div>`;
}
function embedSnippet(){const config={name:bot.name,avatar:bot.avatar,color:bot.color,welcome:bot.welcome,hours:business.hours,services:bot.services};const source=document.querySelector('#nexora-widget-source').textContent;return '<script data-config="'+encodeURIComponent(JSON.stringify(config))+'">'+source+'<'+'/script>';}
function copyEmbed(){const el=document.querySelector('#embedcode');if(!el)return;el.select();navigator.clipboard?.writeText(el.value).then(()=>document.querySelector('#copyhint').textContent='Copied!').catch(()=>document.querySelector('#copyhint').textContent='Select and copy the code manually.');}
function go(p){current=p;render();refreshEmbed()}
function refreshEmbed(){const el=document.querySelector("#embedcode");if(el)el.value=embedSnippet()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHtml(s)}
function ask(t){document.querySelector('#msg').value=t;send()}function send(){let el=document.querySelector('#msg'),t=el.value.trim();if(!t)return;messages.push(['you',t],['ai',demoReply(t)]);render();document.querySelector('#chat').scrollTop=9999}
function addClient(){let v=document.querySelector('#client').value.trim();if(!v)return;clients.push({name:v,date:new Date().toLocaleDateString()});localStorage.nxclients=JSON.stringify(clients);render()}
function addAppt(){let name=document.querySelector('#apname').value,date=document.querySelector('#apdate').value,time=document.querySelector('#apt').value;if(!name||!date||!time)return;appointments.push({name,date,time});localStorage.nxappointments=JSON.stringify(appointments);render()}
function saveBiz(){business={name:document.querySelector('#bn').value,type:document.querySelector('#bt').value,hours:document.querySelector('#bh').value};localStorage.nxbusiness=JSON.stringify(business)}
render();refreshEmbed();
</script><script id="nexora-widget-source" type="text/plain">(function(){
  'use strict';
  const script=document.currentScript;
  if(!script || document.getElementById('nexora-widget-root')) return;
  let cfg={};try{cfg=JSON.parse(decodeURIComponent(script.dataset.config||'{}'));}catch(e){}
  const name=String(cfg.name||'Nexi').slice(0,30), avatar=String(cfg.avatar||'🤖').slice(0,5),welcome=String(cfg.welcome||'¡Hola! ¿En qué puedo ayudarte?').slice(0,250),hours=String(cfg.hours||'Consulta con el negocio.'),services=String(cfg.services||'Pregunta al negocio por sus servicios.');
  const color=/^#[0-9a-fA-F]{6}$/.test(cfg.color)?cfg.color:'#7657d1';
  const host=document.createElement('div');host.id='nexora-widget-root';document.body.appendChild(host);
  const shadow=host.attachShadow({mode:'open'});
  const style=document.createElement('style');style.textContent=`*{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}.launch{position:fixed;bottom:24px;right:24px;z-index:2147483647;border:0;border-radius:50px;padding:14px 18px;background:${color};color:white;box-shadow:0 9px 25px #0003;cursor:pointer;font-size:15px}.panel{position:fixed;right:24px;bottom:84px;width:min(350px,calc(100vw - 32px));height:460px;max-height:calc(100vh - 110px);z-index:2147483647;background:white;border-radius:19px;box-shadow:0 15px 50px #0003;display:none;overflow:hidden;border:1px solid #eee}.panel.open{display:flex;flex-direction:column}.head{padding:17px;background:${color};color:white;font-weight:700;display:flex;justify-content:space-between;align-items:center}.close{background:transparent;border:0;color:white;font-size:24px;cursor:pointer}.messages{flex:1;overflow:auto;padding:16px;background:#faf9ff;display:flex;flex-direction:column;gap:9px}.msg{max-width:85%;border-radius:13px;padding:10px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:white;border:1px solid #eee}.user{align-self:flex-end;background:#e8e3ff}.quick{padding:8px 12px;border:1px solid #ddd;border-radius:20px;background:white;cursor:pointer}.choices{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px}.form{display:flex;padding:10px;border-top:1px solid #eee;gap:8px}.form input{min-width:0;flex:1;border:1px solid #ddd;border-radius:9px;padding:10px}.form button{background:${color};color:white;border:0;border-radius:9px;padding:10px;cursor:pointer}.note{font-size:10px;text-align:center;color:#777;padding-bottom:7px}`;
  shadow.appendChild(style);
  const launch=document.createElement('button');launch.className='launch';launch.textContent=avatar+' Chat';launch.setAttribute('aria-label','Abrir chat');shadow.appendChild(launch);
  const panel=document.createElement('section');panel.className='panel';panel.setAttribute('aria-label','Asistente de demostración');panel.innerHTML='<div class="head"><span></span><button class="close" aria-label="Cerrar chat">×</button></div><div class="messages" role="log" aria-live="polite"></div><div class="choices"></div><form class="form"><input aria-label="Tu mensaje" placeholder="Escribe un mensaje…" maxlength="500" required><button>Enviar</button></form><div class="note">Respuestas de demostración · No es IA real</div>';shadow.appendChild(panel);
  panel.querySelector('.head span').textContent=avatar+' '+name;
  const messages=panel.querySelector('.messages');function add(t,who){let e=document.createElement('div');e.className='msg '+who;e.textContent=t;messages.appendChild(e);messages.scrollTop=messages.scrollHeight;}
  add(welcome,'bot');const choices=panel.querySelector('.choices');['Horarios','Servicios','Reservar'].forEach(q=>{const b=document.createElement('button');b.className='quick';b.textContent=q;b.onclick=()=>reply(q);choices.appendChild(b)});
  function reply(q){add(q,'user');const t=q.toLowerCase();let a=/hora|hour|open/.test(t)?'Nuestro horario: '+hours:/servic|precio|price|cost/.test(t)?'Servicios: '+services:/reserv|cita|book|appoint/.test(t)?'Puedes solicitar una cita contactando directamente al negocio. Las reservas automáticas aún no están activadas.':'Gracias por escribir. Este chatbot es una demostración y todavía no utiliza inteligencia artificial real.';add(a,'bot');}
  panel.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const i=panel.querySelector('input');if(i.value.trim())reply(i.value.trim());i.value='';});
  launch.onclick=()=>{panel.classList.toggle('open');if(panel.classList.contains('open'))panel.querySelector('input').focus()};panel.querySelector('.close').onclick=()=>panel.classList.remove('open');
})();</script></body></html>
